# fuzzel: lancador nativo do Wayland (substitui o rofi), Gruvbox
[main]
font=Cascadia Code:size=10
prompt="apps  "
lines=8
width=40
horizontal-pad=12
vertical-pad=12
inner-pad=8
icons-enabled=no
terminal=alacritty -e

[colors]
# formato RRGGBBAA
background=282828ff
text=ebdbb2ff
match=fabd2fff
selection=3c3836ff
selection-text=fe8019ff
selection-match=fabd2fff
border=fe8019ff

[border]
width=2
radius=0
