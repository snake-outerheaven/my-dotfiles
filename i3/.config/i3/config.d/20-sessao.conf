# 20-sessao.conf - programas que sobem com o i3
exec --no-startup-id xrdb -merge ~/.Xresources
exec_always --no-startup-id ~/.local/bin/fundo
exec --no-startup-id dunst
exec --no-startup-id copyq
exec --no-startup-id sh -c 'sleep 3; copyq loadTheme ~/.local/share/copyq-temas/tango.ini'
exec --no-startup-id xidle -timeout 300 -program ~/.local/bin/bloqueio
