bind h split-window -h
bind | split-window -h

bind v split-window -v
bind - split-window -v

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r M-h resize-pane -L 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5

bind f resize-pane -Z

bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5

# --- cores Gruvbox, destaque amarelo ---
set -g status-style bg=#282828,fg=#a89984
setw -g window-status-current-style bg=#fabd2f,fg=#282828,bold
set -g pane-border-style fg=#3c3836
set -g pane-active-border-style fg=#fabd2f
set -g message-style bg=#3c3836,fg=#fabd2f
