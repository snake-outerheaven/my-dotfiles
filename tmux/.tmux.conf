bind h split-window -h
bind | split-window -h

bind v split-window -v
bind - split-window -v

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r M-h resize-pane -L 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5

bind f resize-pane -Z

bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5

# --- cores: preto com amarelo vivo (iguais ao i3) ---
set -g status-style bg=#0a0a0a,fg=#7a7a7a
setw -g window-status-current-style bg=#ffcc00,fg=#0a0a0a,bold
set -g pane-border-style fg=#1c1c1c
set -g pane-active-border-style fg=#ffcc00
set -g message-style bg=#1c1c1c,fg=#ffcc00
