# i3status-notebook.conf - barra do i3 em Tango, perfil notebook (i3status(1))
# Ordem: volume | bateria | data e hora.
# Modelo: o script barra troca @VOLUME@ pelo arquivo do volume e roda o i3status.

general {
	output_format = "i3bar"
	colors = true
	color_good = "#8ae234"
	color_degraded = "#edd400"
	color_bad = "#ef2929"
	interval = 5
}

order += "read_file VOL"
order += "battery 0"
order += "tztime local"

# O volume vem do sndiod (sndioctl), que o i3status nao le no OpenBSD:
# o script volume grava o valor neste arquivo e avisa o i3status com
# SIGUSR1 (i3status(1), SIGNALS).
read_file VOL {
	path = "@VOLUME@"
	format = "VOL %content"
	format_bad = ""
	# mesma cor do resto da barra (sem isto o read_file sai verde, color_good)
	color_good = "#eeeeec"
}

# OpenBSD: le o apm(4). format_down vazio esconde quando nao ha bateria.
battery 0 {
	format = "BAT %percentage"
	format_down = ""
	format_percentage = "%.0f%s"
	last_full_capacity = true
	low_threshold = 15
	threshold_type = "percentage"
}

tztime local {
	format = "%d/%m  %H:%M"
}
