[window]

opacity = 1
padding.x = 10
padding.y = 10
blur = true

# Preto com amarelo vivo (cores ANSI do Gruvbox, fundo preto)
[colors.primary]
background = '#0a0a0a'
foreground = '#e6e6e6'

[colors.normal]
black   = '#0a0a0a'
red     = '#cc241d'
green   = '#98971a'
yellow  = '#ffcc00'
blue    = '#458588'
magenta = '#b16286'
cyan    = '#689d6a'
white   = '#a89984'

[colors.bright]
black   = '#928374'
red     = '#fb4934'
green   = '#b8bb26'
yellow  = '#ffe066'
blue    = '#83a598'
magenta = '#d3869b'
cyan    = '#8ec07c'
white   = '#ffffff'

[colors.cursor]
text   = '#0a0a0a'
cursor = '#ffcc00'

[colors.selection]
text       = 'CellForeground'
background = '#3a3000'

[font]
size = 9.0

[font.normal]
family = "Cascadia Code"
style = "Regular"


[font.bold]
family = "Cascadia Code"
style = "Bold"

[font.italic]
family = "Cascadia Code"
style = "Italic"

[font.bold_italic]
family = "Cascadia Code"
style = "Bold Italic"
