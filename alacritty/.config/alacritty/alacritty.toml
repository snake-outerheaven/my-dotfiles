# alacritty.toml - modular
# cores.toml: paleta Tango. local.toml: ajustes desta maquina (fora do git; pode nao existir).
# O alacritty pula imports que nao existem (alacritty(5), [general] import).
[general]
import = ["~/.config/alacritty/cores.toml", "~/.config/alacritty/local.toml"]

[window]

opacity = 1
padding.x = 10
padding.y = 10
blur = true

[font]
size = 9.0

[font.normal]
family = "Cascadia Code"
style = "Regular"


[font.bold]
family = "Cascadia Code"
style = "Bold"

[font.italic]
family = "Cascadia Code"
style = "Italic"

[font.bold_italic]
family = "Cascadia Code"
style = "Bold Italic"
